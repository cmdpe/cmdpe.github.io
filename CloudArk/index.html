<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>重置登录密码 · 云舟控制台</title>
<style>
  :root{
    --brand:#4f46e5;
    --brand-dark:#4338ca;
    --brand-soft:rgba(79,70,229,.12);
    --text:#0f172a;
    --text-2:#475569;
    --text-3:#94a3b8;
    --line:#e5e9f0;
    --bg:#f6f8fc;
    --danger:#dc2626;
    --danger-bg:#fef2f2;
    --danger-line:#fecaca;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100%;
  }
  body::before{
    content:"";
    position:fixed;
    inset:-30% -10% auto -10%;
    height:70vh;
    background:
      radial-gradient(45% 60% at 20% 30%, rgba(79,70,229,.16), transparent 70%),
      radial-gradient(40% 55% at 80% 10%, rgba(14,165,233,.14), transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  /* ---------- 顶栏 ---------- */
  .topbar{
    position:relative;
    z-index:2;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.2px;}
  .brand .mark{
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,#6366f1,#0ea5e9);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px rgba(79,70,229,.28);
  }
  .brand .mark svg{width:17px;height:17px;}
  .brand small{font-weight:500;color:var(--text-3);font-size:12px;margin-left:2px;}
  .topnav{display:flex;align-items:center;gap:22px;font-size:13.5px;color:var(--text-2);}
  .topnav a{color:inherit;text-decoration:none;transition:color .15s;}
  .topnav a:hover{color:var(--brand);}

  /* ---------- 主体 ---------- */
  main{
    position:relative;
    z-index:1;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:44px 20px 32px;
  }
  .card{
    width:100%;
    max-width:452px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 24px 50px -18px rgba(15,23,42,.18),0 2px 6px rgba(15,23,42,.04);
    padding:32px 34px 28px;
    animation:rise .45s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  /* 步骤条 */
  .steps{display:flex;align-items:center;gap:6px;margin-bottom:26px;}
  .step{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-3);white-space:nowrap;}
  .step .dot{
    width:20px;height:20px;border-radius:50%;
    border:1.5px solid #dfe4ee;color:#a3adc0;
    font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;background:#fff;
  }
  .step.done .dot{background:#eef2f9;border-color:#e2e8f2;color:#8494ad;}
  .step.active{color:var(--brand);font-weight:600;}
  .step.active .dot{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 4px var(--brand-soft);}
  .bar{flex:1;height:1.5px;background:#e9edf5;border-radius:2px;}

  h1{margin:0 0 8px;font-size:22px;line-height:1.3;letter-spacing:-.2px;}
  .sub{margin:0 0 22px;font-size:13.5px;line-height:1.65;color:var(--text-2);}
  .sub b{color:#334155;font-weight:600;}

  /* 表单 */
  .field{margin-bottom:17px;}
  .field > label{
    display:flex;align-items:center;justify-content:space-between;
    font-size:13px;font-weight:600;color:#334155;margin-bottom:7px;
  }
  .field > label .opt{font-weight:400;color:var(--text-3);font-size:12px;}
  .ctrl{position:relative;display:flex;align-items:center;}
  .ctrl input{
    width:100%;
    height:44px;
    padding:0 42px 0 13px;
    font-size:14px;
    font-family:inherit;
    color:var(--text);
    border:1px solid #dbe1eb;
    border-radius:10px;
    background:#fcfdff;
    outline:none;
    transition:border-color .15s,box-shadow .15s,background .15s;
  }
  .ctrl input::placeholder{color:#aab3c4;}
  .ctrl input:hover{border-color:#cbd4e3;}
  .ctrl input:focus{
    border-color:var(--brand);
    background:#fff;
    box-shadow:0 0 0 4px var(--brand-soft);
  }
  .ctrl.bad input{border-color:#f0a9a9;background:#fffafa;}
  .ctrl.bad input:focus{box-shadow:0 0 0 4px rgba(220,38,38,.1);border-color:#e07070;}
  .eye{
    position:absolute;right:6px;
    width:32px;height:32px;border:0;background:transparent;
    border-radius:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:#9aa5b8;transition:background .15s,color .15s;
  }
  .eye:hover{background:#f1f4fa;color:var(--text-2);}
  .eye svg{width:17px;height:17px;}

  /* 强度条 */
  .strength{margin-top:9px;display:flex;align-items:center;gap:8px;}
  .bars{display:flex;gap:4px;flex:1;}
  .bars i{flex:1;height:4px;border-radius:3px;background:#e9edf5;transition:background .25s;}
  .strength .txt{font-size:11.5px;color:var(--text-3);min-width:26px;text-align:right;}
  .caps{
    margin-top:8px;font-size:12px;color:#b45309;background:#fffbeb;
    border:1px solid #fde68a;border-radius:8px;padding:6px 9px;display:none;
  }
  .caps.on{display:block;}

  /* 报错 */
  .alert{
    display:none;
    align-items:flex-start;gap:9px;
    margin:2px 0 16px;
    padding:11px 12px;
    font-size:13.5px;line-height:1.55;
    color:var(--danger);
    background:var(--danger-bg);
    border:1px solid var(--danger-line);
    border-radius:10px;
  }
  .alert.on{display:flex;}
  .alert.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97) both;}
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-7px);}
    40%,60%{transform:translateX(7px);}
  }
  .alert svg{width:16px;height:16px;flex:0 0 auto;margin-top:2px;}

  /* 按钮 */
  .submit{
    width:100%;height:46px;
    margin-top:6px;
    border:0;border-radius:10px;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.3px;
    color:#fff;
    background:linear-gradient(180deg,#5b53ea,#4f46e5);
    box-shadow:0 8px 18px -8px rgba(79,70,229,.85);
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .12s,box-shadow .15s,filter .15s;
  }
  .submit:hover{filter:brightness(1.05);box-shadow:0 10px 22px -8px rgba(79,70,229,.95);}
  .submit:active{transform:translateY(1px);}
  .submit[disabled]{cursor:progress;filter:saturate(.9) brightness(.98);}
  .spin{
    width:15px;height:15px;border-radius:50%;
    border:2px solid rgba(255,255,255,.45);border-top-color:#fff;
    animation:rot .7s linear infinite;display:none;
  }
  .submit.loading .spin{display:block;}
  @keyframes rot{to{transform:rotate(360deg);}}

  .hint{
    margin:18px 0 0;padding-top:16px;
    border-top:1px dashed #e7ecf4;
    font-size:12.5px;color:var(--text-3);text-align:center;line-height:1.7;
  }
  .hint a{color:var(--brand);text-decoration:none;font-weight:500;}
  .hint a:hover{text-decoration:underline;}

  /* 页脚 */
  footer{
    position:relative;z-index:1;
    padding:0 24px 22px;
    text-align:center;font-size:12px;color:#a6b0c0;
  }
  footer span{margin:0 7px;}

  /* Toast */
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
    z-index:20;
    max-width:min(88vw,420px);
    padding:11px 16px;
    background:rgba(15,23,42,.92);
    color:#fff;font-size:13.5px;line-height:1.5;
    border-radius:10px;
    box-shadow:0 14px 30px -10px rgba(15,23,42,.5);
    opacity:0;pointer-events:none;
    transition:opacity .22s,transform .22s;
  }
  .toast.on{opacity:1;transform:translate(-50%,0);}

  @media (max-width:520px){
    .topbar{padding:0 16px;}
    .topnav{display:none;}
    main{padding:26px 14px;}
    .card{padding:26px 20px 22px;border-radius:14px;}
    h1{font-size:20px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.5 19a4.5 4.5 0 0 0 .5-8.97A6.5 6.5 0 0 0 5.3 11.2A3.9 3.9 0 0 0 6 19z"/>
      </svg>
    </span>
    云舟控制台 <small>CloudArk</small>
  </div>
  <nav class="topnav">
    <a href="#" data-toast="帮助中心正在维护中，请稍后再试。">帮助中心</a>
    <a href="#" data-toast="当前为安全模式，外部链接已禁用。">服务状态</a>
    <a href="#" data-toast="为了保证安全性，本页面的链接暂时不可用。">返回登录</a>
  </nav>
</header>

<main>
  <section class="card" id="card">
    <div class="steps">
      <div class="step done"><span class="dot">✓</span>验证身份</div>
      <span class="bar"></span>
      <div class="step active"><span class="dot">2</span>设置新密码</div>
      <span class="bar"></span>
      <div class="step"><span class="dot">3</span>完成</div>
    </div>

    <h1>设置新的登录密码</h1>
    <p class="sub">身份验证已通过。请为账号 <b>user***@cloudark.cn</b> 设置新密码，设置完成后需要用新密码重新登录。</p>

    <form id="form" novalidate autocomplete="off">
      <div class="field">
        <label for="pwd1">新密码 <span class="opt">8–32 位</span></label>
        <div class="ctrl" id="ctrl1">
          <input id="pwd1" type="password" placeholder="请输入新密码" autocomplete="new-password" spellcheck="false" />
          <button type="button" class="eye" data-eye="pwd1" aria-label="显示密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.7"/>
            </svg>
          </button>
        </div>
        <div class="strength">
          <div class="bars" id="bars"><i></i><i></i><i></i><i></i></div>
          <span class="txt" id="stxt"></span>
        </div>
        <div class="caps" id="caps">⚠ 大写锁定已开启（Caps Lock）</div>
      </div>

      <div class="field">
        <label for="pwd2">确认新密码</label>
        <div class="ctrl" id="ctrl2">
          <input id="pwd2" type="password" placeholder="请再次输入新密码" autocomplete="new-password" spellcheck="false" />
          <button type="button" class="eye" data-eye="pwd2" aria-label="显示密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.7"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="alert" id="alert" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/>
        </svg>
        <span id="alertText"></span>
      </div>

      <button class="submit" id="submit" type="submit">
        <span class="spin"></span><span id="submitText">确认修改</span>
      </button>
    </form>

    <p class="hint">
      忘记原密码？<a href="#" id="forgot">申请人工找回</a><br />
      修改后 24 小时内无法再次修改，请妥善保管新密码。
    </p>
  </section>
</main>

<footer>
  © 2025 云舟科技 CloudArk Inc.<span>·</span><a href="#" data-toast="隐私政策页面正在加载中…" style="color:inherit;text-decoration:none;">隐私政策</a><span>·</span><a href="#" data-toast="服务条款页面正在加载中…" style="color:inherit;text-decoration:none;">服务条款</a>
</footer>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var form      = document.getElementById('form');
  var pwd1      = document.getElementById('pwd1');
  var pwd2      = document.getElementById('pwd2');
  var ctrl1     = document.getElementById('ctrl1');
  var ctrl2     = document.getElementById('ctrl2');
  var alertBox  = document.getElementById('alert');
  var alertText = document.getElementById('alertText');
  var submit    = document.getElementById('submit');
  var submitTxt = document.getElementById('submitText');
  var bars      = document.getElementById('bars').children;
  var stxt      = document.getElementById('stxt');
  var caps      = document.getElementById('caps');
  var toast     = document.getElementById('toast');

  var FINAL_MSG = '为了保证安全性，新密码不能与原密码不同';
  var LEVELS = [
    { t: '',   c: '' },
    { t: '弱',  c: '#ef4444' },
    { t: '一般', c: '#f59e0b' },
    { t: '强',  c: '#22c55e' },
    { t: '很强', c: '#0ea5e9' }
  ];

  /* ---------- 小工具 ---------- */
  function showAlert(msg) {
    alertText.textContent = msg;
    alertBox.classList.add('on');
    alertBox.classList.remove('shake');
    void alertBox.offsetWidth;   // 重启动画
    alertBox.classList.add('shake');
  }
  function clearAlert() {
    alertBox.classList.remove('on', 'shake');
    ctrl1.classList.remove('bad');
    ctrl2.classList.remove('bad');
  }
  function toastMsg(msg) {
    toast.textContent = msg;
    toast.classList.add('on');
    clearTimeout(toastMsg._t);
    toastMsg._t = setTimeout(function () { toast.classList.remove('on'); }, 2600);
  }

  /* ---------- 强度条 ---------- */
  function score(v) {
    if (!v) return 0;
    var s = 0;
    if (v.length >= 8)  s++;
    if (v.length >= 12) s++;
    if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
    if (/\d/.test(v)) s++;
    if (/[^A-Za-z0-9]/.test(v)) s++;
    if (s <= 1) return 1;
    if (s === 2) return 2;
    if (s <= 4) return 3;
    return 4;
  }
  function paint() {
    var lv = score(pwd1.value);
    for (var i = 0; i < 4; i++) {
      bars[i].style.background = (lv > 0 && i < lv) ? LEVELS[lv].c : '#e9edf5';
    }
    stxt.textContent = LEVELS[lv].t;
    stxt.style.color = lv ? LEVELS[lv].c : '#94a3b8';
  }

  /* ---------- 显示 / 隐藏密码 ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('.eye'), function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.getAttribute('data-eye'));
      var show  = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.style.color = show ? '#4f46e5' : '';
      input.focus();
    });
  });

  /* ---------- 大写锁定提示 ---------- */
  function capsCheck(e) {
    if (typeof e.getModifierState !== 'function') return;
    caps.classList.toggle('on', e.getModifierState('CapsLock'));
  }
  [pwd1, pwd2].forEach(function (el) {
    el.addEventListener('keydown', capsCheck);
    el.addEventListener('keyup', capsCheck);
    el.addEventListener('blur', function () { caps.classList.remove('on'); });
  });

  /* ---------- 输入时清掉报错 ---------- */
  [pwd1, pwd2].forEach(function (el) {
    el.addEventListener('input', function () {
      if (alertBox.classList.contains('on')) clearAlert();
    });
  });
  pwd1.addEventListener('input', paint);

  /* ---------- 提交 ---------- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var a = pwd1.value, b = pwd2.value;

    // 一切正常网站都会先做的基础校验
    if (!a) { ctrl1.classList.add('bad'); pwd1.focus(); return showAlert('请输入新密码'); }
    if (a.length < 8) { ctrl1.classList.add('bad'); pwd1.focus(); return showAlert('密码长度至少为 8 位，请重新输入'); }
    if (a.length > 32) { ctrl1.classList.add('bad'); pwd1.focus(); return showAlert('密码长度不能超过 32 位'); }
    if (!/[A-Za-z]/.test(a) || !/\d/.test(a)) { ctrl1.classList.add('bad'); pwd1.focus(); return showAlert('密码需同时包含字母和数字'); }
    if (/\s/.test(a)) { ctrl1.classList.add('bad'); pwd1.focus(); return showAlert('密码中不能包含空格'); }
    if (!b) { ctrl2.classList.add('bad'); pwd2.focus(); return showAlert('请再次输入新密码'); }
    if (a !== b) { ctrl2.classList.add('bad'); pwd2.focus(); return showAlert('两次输入的密码不一致，请重新确认'); }

    // 看起来在认真校验
    clearAlert();
    submit.disabled = true;
    submit.classList.add('loading');
    submitTxt.textContent = '正在校验…';

    setTimeout(function () {
      submit.disabled = false;
      submit.classList.remove('loading');
      submitTxt.textContent = '确认修改';
      ctrl1.classList.add('bad');
      ctrl2.classList.add('bad');
      showAlert(FINAL_MSG);
      pwd1.focus();
      pwd1.select();
    }, 900);
  });

  /* ---------- 页面里那些“死链接” ---------- */
  document.getElementById('forgot').addEventListener('click', function (e) {
    e.preventDefault();
    toastMsg('很抱歉，为了保证安全性，原密码也无法通过人工找回。');
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-toast]'), function (el) {
    el.addEventListener('click', function (e) {
      e.preventDefault();
      toastMsg(el.getAttribute('data-toast'));
    });
  });

  pwd1.focus();
})();
</script>
</body>
</html>
