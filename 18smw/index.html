<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>請確保你已滿18歲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        
        .age-verification {
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            margin-bottom: 20px;
            font-size: 2.2rem;
            color: #fdbb2d;
        }
        
        p {
            margin-bottom: 30px;
            line-height: 1.6;
            font-size: 1.1rem;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 160px;
        }
        
        #confirm-btn {
            background: #4CAF50;
            color: white;
        }
        
        #confirm-btn:hover {
            background: #45a049;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }
        
        #deny-btn {
            background: #f44336;
            color: white;
        }
        
        #deny-btn:hover {
            background: #da190b;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }
        
        .warning {
            margin-top: 25px;
            padding: 15px;
            background: rgba(255, 0, 0, 0.2);
            border-radius: 8px;
            font-size: 0.9rem;
            border-left: 4px solid #f44336;
        }
        
        .age-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #fdbb2d;
        }
        
        @media (max-width: 480px) {
            .age-verification {
                padding: 25px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="age-verification">
        <div class="age-icon">🔞</div>
        <h1>年齡驗證</h1>
        <p>根據法律規定，您必須年滿18歲才能訪問此網站內容。</p>
        <p>請確認您的年齡：</p>
        
        <div class="buttons">
            <button id="confirm-btn">我已滿18歲</button>
            <button id="deny-btn">我未滿18歲</button>
        </div>
        
        <div class="warning">
            注意：虛報年齡可能違反相關法律規定，請如實選擇。
        </div>
    </div>

    <script>
        document.getElementById('confirm-btn').addEventListener('click', function() {
            // 這裡可以添加更複雜的年齡驗證邏輯
            // 例如：記錄用戶選擇、設置cookie等
            
            // 跳轉到主頁面
            window.location.href = 'main/index.html';
        });
        
        document.getElementById('deny-btn').addEventListener('click', function() {
            // 顯示退出訊息
            alert('很抱歉，您必須年滿18歲才能訪問此網站。');
            
            // 可以選擇關閉窗口或跳轉到其他安全頁面
            // window.close(); // 在某些瀏覽器中可能無法使用
            // 或者跳轉到退出頁面
            // window.location.href = 'exit.html';
            
            // 這裡我們簡單地停留在當前頁面
            // 在實際應用中，您可以重定向到首頁或其他合適的頁面
        });
    </script>
</body>
</html>
